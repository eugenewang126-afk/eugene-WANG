name: Run Energy Patch Payload

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/run-energy-payload.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply verified energy.html patch
        shell: bash
        run: |
          set -euo pipefail
          before_sha="$(git hash-object energy.html)"
          if [ "$before_sha" != "354978e8a80a000df0c355609b249e2b2c3cbcf1" ]; then
            echo "Unexpected energy.html blob: $before_sha"
            exit 1
          fi

          b64="$({
            awk '
              /energy.patch.b64 <<\x27B64\x27/ { capture=1; next }
              /^          B64$/ { capture=0 }
              capture { gsub(/^[[:space:]]+|[[:space:]]+$/, ""); printf "%s", $0 }
            ' .github/workflows/apply-energy-takeover.yml
          })"
          b64="${b64/b3ZlcmZsd3ctd3JhcD/b3ZlcmZsb3ctd3JhcD}"
          printf '%s' "$b64" | base64 -d > /tmp/energy.patch
          git apply --check /tmp/energy.patch
          git apply /tmp/energy.patch

          after_sha="$(git hash-object energy.html)"
          if [ "$after_sha" != "9886c6a58909084f2562e1d6fedb5566089dd4d4" ]; then
            echo "Patched energy.html blob mismatch: $after_sha"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add energy.html
          git commit -m 'Improve energy page reading experience'
          git push
